# 受控缺陷对 —— C「六边形主镜」（缺陷侧），5 件。
#
# 设计意图（供 A-H1-1 第三项"六边形主镜"回放）：
#   与 mirror_round.yaml **逐行同构**——同一批部件、同一摆放、同一机位/取景/光照/尺度，
#   只有 `mirror` 一行不同（本文件用 hex_plate.glb：对边比 1.35 的六边形板；
#   那一侧用 disc.glb 圆板）。布局关于原点对称（镜件居中、两片屏盘分居左右、
#   两根横杆上下），故整器包围盒与相机正交尺度在两份 spec 间逐值一致。
#
# 为什么六边形板是 1.35:1 的拉长六边形（不是正六边形）：
#   T2a 的 circle 判据只用两个量（circle_fill = 4A/(πwh) ∈ [0.88, 1.12] 与 PCA 涨宽比
#   ≤ 1.25）。正六边形 circle_fill = 1.103（在带内）、六重对称使其 PCA 涨宽比 = 1.00，
#   且与圆板经受同一投影压缩因子 —— 正六边形与圆盘在**旧**判据下数学上不可分。
#   本件当初就是为绕过这条边界而拉长到 1.35（正视包围盒 2.40 × 2.81）。第 5 轮给
#   imgfeat/T2a 补了 polygon 判据（凸包抽稀直边数 + 残差 + 凸包充实度），正六边形已能
#   单独判出 polygon/hexagon（验收样本见 mirror_hex_regular.yaml）；本件作为"拉长六边形"
#   附加用例保留——它同时也是 polygon 判据对"非正多边形"的边界样本。
#
# 摆放口径（refgen 约定）：每件先按自身包围盒中心对中，再 scale → rot_deg（XYZ 欧拉）
# → offset_m；front 机位（--angles 0,0,0 --ortho）下屏幕右＝+X、屏幕上＝+Z。
tool: primer-imgrefgen
name: mirror_hex
models_root: ../parts
parts:
  # 主镜：六边形板（对边比 1.35，板面 XY 平面）
  - name: mirror
    part: hex_plate.glb
    rot_deg: [90, 0, 0]
    offset_m: [0, 0, 0]
  # 遮阳屏盘 ×2：Ø2.4 圆盘分居主镜左右（各留 2.2 与 2.2 的间隙）
  - name: shade_left
    part: disc.glb
    rot_deg: [90, 0, 0]
    offset_m: [-3.4, 0, 0]
  - name: shade_right
    part: disc.glb
    rot_deg: [90, 0, 0]
    offset_m: [3.4, 0, 0]
  # 桁架杆 ×2：上下各一根横杆（4.4 长 × 0.2 厚），围出比主镜更大的包络
  - name: strut_top
    part: bar.glb
    scale: [0.55, 1, 1]
    offset_m: [0, 0, 2.6]
  - name: strut_bottom
    part: bar.glb
    scale: [0.55, 1, 1]
    offset_m: [0, 0, -2.6]
truth:
  default_shape_class: other
  parts:
    mirror: other
    shade_left: circle
    shade_right: circle
    strut_top: rod
    strut_bottom: rod
expect:
  pose: az0_el0_roll0
  component_count: 5
  height_fraction:
    mirror: 0.5011
    shade_left: 0.4286
    strut_top: 0.0714
  area_fraction:
    mirror: 0.2867
    shade_left: 0.2568
    strut_top: 0.0999
